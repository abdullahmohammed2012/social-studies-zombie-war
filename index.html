<script>
/* ESCAPE THE ZOMBIE ROOM - classic script, no modules, runs from file://

   Each question lists answer "points"; a point = alternatives separated by |, "a+b" means both stems must appear.
   r = points required. Add questions by calling Q(...) below. */
const $=s=>document.querySelector(s),W=800,H=500,SV='ezr1',TOUCH=matchMedia('(pointer:coarse)').matches;
let sv={u:1,d:[],best:0,mute:0,st:{}};

const nz=s=>s.toLowerCase().replace(/(.)\1{2,}/g,'$1').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ء/g,'').replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[^\u0621-\u064Aa-z0-9\s]/gi,' ').replace(/\s+/g,' ').trim();
const P2=a=>a.map(s=>s.split('|').map(x=>x.split('+').map(nz)));
const W_='من هو؟',R_='ما النتائج المترتبة على؟',E_='بم تفسر؟',M_='ما المقصود بـ؟';
const NM={col:/كولومب|كولمب|كلومب|كلمب|كريستوف|كرستوف|كليستوف|كريستفر|كلستوف|columb|colomb|christoph/,ves:/امريجو|اميريجو|امريغو|اميريغو|امريكو|اميركو|اميريكو|فيسبوتش|فسبوتش|فيسبوش|فسبوش|vespuc|amerigo/,mag:/ماجلان|ماجيلان|ماغلان|ماغيلان|ماجلن|ماجيلن|ماجلين|magel|magal/,cook:/كوك|cook/,maj:/ماجد|ماجيد|majid/};
const QS=[],Q=(c,t,q,r,p,h,w)=>QS.push({id:QS.length,c,t,q,r:1,p:P2(p),h,w})/* r forced to 1: one correct point is enough; set r back to the argument to require more */;
/* من هو؟ (1 point: the person; other people's names are rejected) */
Q(W_,'المستكشفون','مستكشف إيطالي يعود له الفضل في اكتشاف جزر البهاما؟',1,[],'ك','col');
Q(W_,'المستكشفون','مستكشف إيطالي أُطلق اسمه على القارتين الجديدتين؟',1,[],'أ','ves');
Q(W_,'المستكشفون','مستكشف أطلق على المحيط الهادي هذا الاسم؟',1,[],'م','mag');
Q(W_,'المستكشفون','مستكشف بريطاني أعلن تبعية الساحل الشرقي لأستراليا لبريطانيا عام 1770م؟',1,[],'ج','cook');
Q(W_,'المستكشفون','عالم وملاح مسلم وضع قواعد دقيقة للملاحة واستفاد الأوروبيون من مؤلفاته وخرائطه؟',1,[],'أ','maj');
/* ما النتائج (2 of 3, or 2 of 2) */
Q(R_,'نتائج الكشوف','وصول البحار البريطاني جيمس كوك إلى الساحل الشرقي لأستراليا عام 1770م؟',2,['خرائط|خريطه','تبعي|ضم+بريطاني|اعلن+بريطاني|ملك+بريطاني','استيطان|استوطن|مستوطن|استعمار']);
Q(R_,'نتائج الكشوف','انتشار الأمراض والأوبئة الوافدة مثل الجدري والإنفلونزا التي جلبها الأوروبيون إلى العالم الجديد؟',2,['وفاه|وفيات|موت|مات|هلك|هلاك|ابيد|اباده|قتل','مناع']);
Q(R_,'نتائج الكشوف','الكشوف الجغرافية بالنسبة لتجارة العالم والمحيط الأطلنطي؟',2,['طريق+تجار|مركز+تجار|محور+تجار|رئيسي+تجار|ممر+تجار','ذهب|فضه']);

Q(E_,'دوافع الكشوف','سعي الدول الأوروبية إلى زيادة ثرواتها من المعادن النفيسة، خاصة الذهب والفضة؟',1,['سك|نقود|نقد|عمله']);

Q(W_,'المستكشفون','مستكشف توصل إلى أن الأراضي المكتشفة ليست جزءًا من آسيا بل عالم جديد وقارة مستقلة؟',1,[],'أ','ves');
